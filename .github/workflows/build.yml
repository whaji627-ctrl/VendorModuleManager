
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source
        run: unzip -q VendorModuleManager-Mobile-Build.zip -d source

      - name: Build APK
        run: gradle --no-daemon -p source assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VendorModuleManager-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
